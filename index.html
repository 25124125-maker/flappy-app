<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy</title><meta name="theme-color" content="#f8faff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Flappy"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Yu Gothic",sans-serif;color:#142750;background:#f8faff}header{background:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e9f0}.logo{font-size:35px;font-weight:900}button{cursor:pointer;font:inherit}header button,.outline{border:1px solid #a8ccef;background:white;color:#1477c6;border-radius:9px;padding:10px}.layout{display:grid;grid-template-columns:180px 1fr}aside{background:white;min-height:90vh;padding:18px 10px}.nav{padding:14px;border-radius:9px;cursor:pointer;margin-bottom:8px;font-weight:bold}.nav.active{background:#ffe7ef;color:#e8316c}main{padding:22px;max-width:1500px;width:100%;margin:auto}h1{font-size:24px}h2{font-size:18px}.cols{display:grid;grid-template-columns:2fr 1fr;gap:15px}.card{background:white;border:1px solid #e3e8f2;border-radius:15px;padding:18px;margin-bottom:14px}.pink{background:#fff3f7}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.option{background:white;border:1px solid #dfe5ee;border-radius:12px;padding:15px 7px;min-height:105px;color:#142750}.option.sel{border:2px solid #fb4980;background:#fff1f6}.emoji{display:block;font-size:30px}.option small{display:block;color:#78869a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;padding:5px}input[type=checkbox]{accent-color:#f34a80}.field{width:100%;padding:11px;border:1px solid #dbe3ef;border-radius:8px;margin:9px 0}.primary{background:#f94b80;color:white;border:0;border-radius:9px;padding:14px;font-weight:bold;width:100%}.tag{display:inline-block;background:#ffe7ef;color:#b42e5a;padding:5px 8px;border-radius:6px;margin:3px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.danger{color:#d82b63;border:1px solid #f59eb5;background:white;border-radius:9px;padding:10px}.request{border:1px solid #e5eaf2;border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer;background:white}.request.sel{background:#fff2f6;border-color:#f56d99}.muted{color:#76839b;font-size:13px}.status{background:#e4f2ff;color:#1479c6;border-radius:10px;padding:4px 9px;font-size:12px}@media(max-width:850px){.cols{grid-template-columns:1fr}.options{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.layout{grid-template-columns:1fr}aside{display:flex;min-height:0;overflow:auto}.nav{white-space:nowrap;font-size:12px}main{padding:12px}.grid{grid-template-columns:1fr}header{padding:10px}.logo{font-size:27px}}
</style><header><span class="logo">Flappy <span style="color:#f84a7b">✦</span></span><div><span id="person">松下 光</span> <button onclick="switchRole()">上司側 ⇄ 部下側</button></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div><script>
const bosses=[['田中 健一','営業部 部長','👨🏻‍💼'],['佐藤 優','営業部 課長','👩🏻‍💼'],['鈴木 大地','マーケティング部 課長','👨🏻‍💻'],['山田 彩','企画部 課長','👩🏻‍💼']];
const modes=['1対1で話したい','1人の上司 対 複数の部下','複数の上司 対 1人の部下','スポーツ観戦に一緒に行く'];
const icons=['🗣️','👥','👨‍👩‍👧','🏟️'];
const topics=['業務の進め方','仕事の優先順位','キャリア・将来設計','スキルアップ','人間関係','職場環境','業務量・働き方','評価・フィードバック','プライベートとの両立','その他'];
let initial=[{id:1,name:'松下 光',boss:0,mode:0,topics:['仕事の優先順位','キャリア・将来設計'],msg:'キャリアについて相談したいです。',status:'未対応'},{id:2,name:'佐藤 優',boss:0,mode:1,topics:['業務の進め方'],msg:'チームの仕事について相談したいです。',status:'対応中'},{id:3,name:'山田 彩',boss:0,mode:3,topics:['人間関係'],msg:'一緒に野球の試合を応援しに行きたいです！',status:'未対応'}];
let data=JSON.parse(localStorage.getItem('flappy_demo')||'null')||initial;
let role='employee',page='register',boss=0,mode=0,chosen=['業務の進め方','仕事の優先順位','キャリア・将来設計'],msg='',active=1,filter='すべて';
function save(){localStorage.setItem('flappy_demo',JSON.stringify(data))}function e(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function switchRole(){role=role==='employee'?'manager':'employee';page=role==='employee'?'register':'requests';render()}
function go(x){page=x;render()}function weekly(){return `<div class="card pink"><h2>🗓 1週間後の設定確認</h2><p class="muted">1週間ごとに希望を見直せます。</p><div class="row"><button class="outline" onclick="resetAccount()">アカウントリセット（継続）</button><button class="danger" onclick="deleteAccount()">アカウント削除</button></div></div>`}
function resetAccount(){if(confirm('松下 光の登録希望を消去して、利用を継続しますか？')){data=data.filter(x=>x.name!=='松下 光');save();chosen=[];msg='';mode=0;boss=0;page='register';render()}}
function deleteAccount(){if(confirm('松下 光のデモデータを削除しますか？')){data=data.filter(x=>x.name!=='松下 光');save();page='home';render()}}
function chooseBoss(i){boss=i;render()}function chooseMode(i){mode=i;render()}function topic(t,checked){chosen=checked?[...new Set([...chosen,t])]:chosen.filter(x=>x!==t);render()}
function submit(){if(!chosen.length){alert('相談内容を選択してください');return}data.unshift({id:Date.now(),name:'松下 光',boss,mode,topics:[...chosen],msg,status:'未対応'});save();page='history';render();alert('希望を登録しました。上司側の画面に反映されます。')}
function employee(){return `<h1>コミュニケーションの希望を登録する</h1><p class="muted">話したい気持ちに、きっかけを。</p><div class="cols"><section><div class="card"><h2>❶ 上司を選択</h2><div class="options">${bosses.map((b,i)=>`<button class="option ${boss===i?'sel':''}" onclick="chooseBoss(${i})"><span class="emoji">${b[2]}</span><b>${b[0]}</b><small>${b[1]}</small></button>`).join('')}</div></div><div class="card"><h2>❷ 希望する対話形式</h2><div class="options">${modes.map((m,i)=>`<button class="option ${mode===i?'sel':''}" onclick="chooseMode(${i})"><span class="emoji">${icons[i]}</span><b>${m}</b></button>`).join('')}</div></div><div class="card"><h2>❸ 相談したい内容（複数選択可）</h2><div class="grid">${topics.map(t=>`<label><input type="checkbox" ${chosen.includes(t)?'checked':''} onchange="topic('${t}',this.checked)"> ${t}</label>`).join('')}</div><textarea class="field" rows="3" placeholder="具体的な相談内容（任意）" oninput="msg=this.value">${e(msg)}</textarea></div><button class="primary" onclick="submit()">登録内容を確認して送信する →</button></section><section><div class="card pink"><h2>登録内容の確認</h2><div class="card">👩🏻‍💼 松下 光　<small>営業部・3年目</small></div><h3>選択した上司</h3><div class="card">${bosses[boss][2]} ${bosses[boss][0]}</div><h3>希望する対話形式</h3><div class="card">${icons[mode]} ${modes[mode]}</div><h3>相談したい内容</h3>${chosen.map(t=>`<span class="tag">${t}</span>`).join('')}</div>${weekly()}</section></div>`}
function manager(){let arr=data.filter(x=>x.boss===0&&(filter==='すべて'||x.status===filter));let selected=data.find(x=>x.id===active)||arr[0];return `<h1>部下の希望一覧</h1><p class="muted">あなたを上司として選択した部下の希望が表示されます（デモ）。</p><div class="row">${['すべて','未対応','対応中','対応済み'].map(x=>`<button class="outline" onclick="filter='${x}';render()">${x}（${data.filter(r=>r.boss===0&&(x==='すべて'||r.status===x)).length}）</button>`).join('')}</div><div class="cols" style="margin-top:15px"><section>${arr.map(x=>`<div class="request ${selected?.id===x.id?'sel':''}" onclick="active=${x.id};render()"><b>👤 ${e(x.name)}</b> <span class="status">${x.status}</span><p>${icons[x.mode]} ${modes[x.mode]}</p>${x.topics.map(t=>`<span class="tag">${e(t)}</span>`).join('')}<p class="muted">詳細を見る ›</p></div>`).join('')||'<div class="card">該当する希望はありません</div>'}</section><section>${selected?`<div class="card"><h2>👤 ${e(selected.name)}</h2><span class="status">${selected.status}</span><h3>希望する対話形式</h3><div class="card pink">${icons[selected.mode]} ${modes[selected.mode]}</div><h3>相談内容</h3>${selected.topics.map(t=>`<span class="tag">${e(t)}</span>`).join('')}<h3>詳細メッセージ</h3><div class="card">${e(selected.msg)||'なし'}</div><div class="row"><button class="outline" onclick="status(${selected.id},'対応中')">対応する</button><button class="outline" onclick="status(${selected.id},'対応済み')">対応済みにする</button><button class="outline" onclick="status(${selected.id},'未対応')">未対応に戻す</button></div></div>`:''}${weekly()}</section></div>`}
function status(id,s){let x=data.find(r=>r.id===id);if(x){x.status=s;save();render()}}
function render(){document.getElementById('person').textContent=role==='employee'?'👩🏻‍💼 松下 光':'👨🏻‍💼 田中 健一';let links=role==='employee'?[['home','⌂ ホーム'],['register','✎ 希望の登録'],['history','▤ 提出履歴'],['settings','⚙ 設定']]:[['home','⌂ ホーム'],['requests','♧ 部下の希望一覧'],['history','▤ 対応履歴'],['settings','⚙ 設定']];document.getElementById('nav').innerHTML=links.map(([p,t])=>`<div class="nav ${page===p?'active':''}" onclick="go('${p}')">${t}</div>`).join('');document.getElementById('app').innerHTML=page==='register'&&role==='employee'?employee():page==='requests'&&role==='manager'?manager():page==='history'?`<h1>${role==='employee'?'提出履歴':'対応履歴'}</h1>${data.filter(x=>role==='employee'?x.name==='松下 光':x.boss===0&&x.status==='対応済み').map(x=>`<div class="card"><b>${e(x.name)}</b> — ${modes[x.mode]} <span class="status">${x.status}</span><p>${x.topics.join('・')}</p></div>`).join('')||'<div class="card">履歴はありません</div>'}`:page==='settings'?weekly()+`<div class="card"><button class="outline" onclick="if(confirm('初期データに戻しますか？')){data=JSON.parse(JSON.stringify(initial));save();render()}">デモデータを初期状態に戻す</button></div>`:`<h1>Flappyへようこそ</h1><div class="card"><h2>話したい気持ちに、きっかけを。</h2><p>あなたの希望から始まるコミュニケーション。</p><button class="primary" onclick="go('${role==='employee'?'register':'requests'}')">画面を開く</button></div>`}
render();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></html>
